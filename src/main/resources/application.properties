spring.application.name=Local Mock Server

# DataSource - SQLite embedded (no external DB needed)
spring.datasource.url=jdbc:sqlite:./data/mock-server.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# SQLite only supports one writer; cap the pool to 1
spring.datasource.hikari.maximum-pool-size=1

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.example.mockserver=INFO

# App settings
app.call-log.retention-days=30
app.proxy.timeout-seconds=30
